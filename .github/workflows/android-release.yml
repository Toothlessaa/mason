name: Android Release Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate required secrets
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret ANDROID_KEYSTORE_B64 is missing or empty. Add it in Settings > Secrets and variables > Actions."; exit 1; fi
          if [ -z "$STORE_PASS" ]; then echo "::error::Secret ANDROID_STORE_PASSWORD is missing or empty."; exit 1; fi
          if [ -z "$KEY_PASS" ]; then echo "::error::Secret ANDROID_KEY_PASSWORD is missing or empty."; exit 1; fi
          if [ -z "$KEY_ALIAS" ]; then echo "::error::Secret ANDROID_KEY_ALIAS is missing or empty."; exit 1; fi
          if [ -z "$SUPABASE_URL" ]; then echo "::error::Secret EXPO_PUBLIC_SUPABASE_URL is missing or empty."; exit 1; fi
          if [ -z "$SUPABASE_KEY" ]; then echo "::error::Secret EXPO_PUBLIC_SUPABASE_ANON_KEY is missing or empty."; exit 1; fi
          if [ -z "$GOOGLE_SERVICES" ]; then echo "::error::Secret GOOGLE_SERVICES_JSON_B64 is missing or empty."; exit 1; fi
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Install Firebase config
        working-directory: mobile
        run: |
          echo "$GOOGLE_SERVICES" | base64 -d > google-services.json
          test -s google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}

      - name: Generate Expo project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Install signing keystore and patch build.gradle
        working-directory: mobile
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/masonic-upload.keystore
          node scripts/set-release-signing.mjs
          test -s android/app/masonic-upload.keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_FILE: masonic-upload.keystore
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Android Build #${{ github.run_number }}
          files: mobile/android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
          fail_on_unmatched_files: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
